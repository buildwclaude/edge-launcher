name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk edge-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: edge-debug-apk
          path: edge-debug.apk

      - name: Update "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest edge-debug.apk \
            --prerelease \
            --title "Edge (latest debug build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download edge-debug.apk on your phone and install it."
